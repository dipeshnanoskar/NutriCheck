name: nutricheck
description: "NutriCheck - scan barcodes or ingredient labels and get instant age-based nutrition guidance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Barcode scanning (real camera-based scanner)
  mobile_scanner: ^5.2.3

  # Camera for OCR ingredient-label capture
  camera: ^0.11.0+2

  # Local persistence (auth token, cached profile)
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # UI helpers
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
   

dependency_overrides:
  path_provider_android: 2.2.14